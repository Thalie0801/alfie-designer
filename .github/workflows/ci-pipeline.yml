name: CI Pipeline

on:
  push:
    branches:
      - main
      - refonte-alfie-2025
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches:
      - main
      - refonte-alfie-2025
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  quality-checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-online
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript checks
        run: npm run type-check
      - name: Run unit tests
        run: npm test

  guard-landing:
    name: Guard landing changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect landing file changes
        id: changes
        uses: tj-actions/changed-files@v41
        with:
          files: |
            apps/landing/**
            www/**
            site/**
      - name: Block landing modifications
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          echo "::error::Landing files modified"
          exit 1
      - name: No landing changes detected
        if: steps.changes.outputs.any_changed != 'true'
        run: echo "✅ No landing changes"

  alfie-validation:
    name: Alfie sessions validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-online
      - name: Validate Alfie sessions
        run: npm run validate:sessions

  codex:
    name: Refonte Codex automation
    needs:
      - quality-checks
      - guard-landing
      - alfie-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-online
      - name: Run Codex automation
        run: bash scripts/codex/run.sh
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Codex: automated refactoring"
          title: "🤖 Codex: automated refactoring"
          body: |
            Automated PR generated by Codex workflow.

            - Code analysis completed
            - Refactoring suggestions applied
          branch: codex/auto-${{ github.run_id }}
          base: refonte-alfie-2025
          labels: |
            automated
            codex
