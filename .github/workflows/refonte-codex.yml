name: Refonte Codex (push→pull, disable autopublish)

on:
  workflow_dispatch: {}
  push:
    branches: [ main, refonte-alfie-2025 ]
  pull_request:
    branches: [ main, refonte-alfie-2025 ]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure npm auth (optional)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
            echo "NPM auth configured."
          else
            echo "No NPM_TOKEN secret; skipping npm auth."
          fi

      - name: Force public npm registry
        run: npm config set registry https://registry.npmjs.org/

      # Si Codex n'a pas besoin d'installer, laisse comme ça. Sinon dé-commente l'étape suivante.
      # - name: Install dependencies
      #   run: |
      #     npm ci --prefer-online || (echo "retry npm ci…" && sleep 3 && npm ci --prefer-online)

      - name: Prepare Codex script (chmod + LF)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/codex/run.sh ]; then
            echo "::warning title=Codex::scripts/codex/run.sh introuvable. Étapes suivantes continueront sans Codex."
            exit 0
          fi
          # Convertit CRLF -> LF si besoin
          sed -i 's/\r$//' scripts/codex/run.sh || true
          chmod +x scripts/codex/run.sh
          head -n 1 scripts/codex/run.sh || true

      - name: Run Codex script
        id: codex
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail
          if [ -f scripts/codex/run.sh ]; then
            bash scripts/codex/run.sh
          else
            echo "Codex absent, rien à exécuter."
          fi

      # ---- Diff + Guard ----
      - name: Compute diff
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git -c core.quotepath=false status --porcelain)"
          if [ -z "${CHANGED}" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(echo "${CHANGED}" | awk '
            $1 ~ /^\?\?/ { $1=""; sub(/^ +/,""); print; next }
            $1 ~ /^R/   { match($0, /-> (.*)$/, m); if (m[1]!="") print m[1]; next }
            { $1=""; sub(/^ +/,""); print }')"
          echo "files<<__EOF__" >> "$GITHUB_OUTPUT"
          echo "${FILES}" >> "$GITHUB_OUTPUT"
          echo "__EOF__" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Guard — No landing changes
        if: steps.diff.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILES="${{ steps.diff.outputs.files }}"
          echo "Changed files:"
          echo "${FILES}" | sed 's/^/ - /'
          if echo "${FILES}" | grep -E -q '^(apps/landing/|www/|site/)'; then
            echo "::error title=Landing modifiée::Ce patch ne doit pas toucher la landing."
            echo "${FILES}" | grep -E '^(apps/landing/|www/|site/)' | sed 's/^/ - /'
            exit 1
          fi
          echo "OK: aucune modification dans apps/landing, www ou site."

      - name: Fail if Codex failed
        if: steps.codex.outcome == 'failure'
        run: |
          echo "::error title=Codex a échoué::Voir les logs de l'étape 'Run Codex script'."
          exit 1

      # ---- PR seulement si changements + pas depuis un event PR ----
      - name: Create Pull Request
        if: steps.diff.outputs.has_changes == 'true' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Codex: push→pull, autopublish off, premium confirmation flag"
          title: "Codex: push→pull, autopublish off, premium confirmation flag"
          body: |
            Cette PR est générée par le workflow Codex.
            - Passage du flux push ➜ pull request
            - Autopublish désactivé
            - Ajout du flag de confirmation premium
          branch: codex/refonte-alfie-2025-${{ github.run_id }}
          base: refonte-alfie-2025
          author: "alfie-codex-bot <codex@alfie.local>"
          committer: "alfie-codex-bot <codex@alfie.local>"
          labels: |
            automated
            codex
          draft: false

