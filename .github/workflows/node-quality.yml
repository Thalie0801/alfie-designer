name: Node Quality Checks

on:
  workflow_dispatch: {}
  push:
    branches: [main, refonte-alfie-2025]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.json'
      - '**/*.css'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'bun.lockb'
      - 'tsconfig*.json'
      - 'next.config.*'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'eslint.config.*'
      - '.github/workflows/node-quality.yml'
  pull_request:
    branches: [main, refonte-alfie-2025]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.json'
      - '**/*.css'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'bun.lockb'
      - 'tsconfig*.json'
      - 'next.config.*'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'eslint.config.*'
      - '.github/workflows/node-quality.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: node-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: '20'
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  install:
    name: Install deps (with cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Strip control chars
        run: |
          bash scripts/dev/strip-control-chars.sh

      - name: Fail on control chars in source
        shell: bash
        run: |
          bad=$(git ls-files | grep -E '\\.(ts|tsx|js|jsx|json|md|yaml|yml|sh)$' | xargs -I{} bash -lc "LC_ALL=C grep -nU $'[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F]' '{}' || true")
          if [ -n "$bad" ]; then
            echo "::error title=Control chars detected::"
            echo "$bad"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Show Node & registry
        run: |
          node -v
          npm -v
          npm config get registry
          ls -la

      - name: Configure npm auth (optional)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
            echo "npm auth OK"
          else
            echo "No NPM_TOKEN (OK si deps publiques)"
          fi

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "mgr=pnpm" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -f yarn.lock ]; then echo "mgr=yarn" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -f package-lock.json ]; then echo "mgr=npm" >> $GITHUB_OUTPUT; exit 0; fi
          echo "::error::No lockfile (pnpm-lock.yaml | yarn.lock | package-lock.json)."; exit 1

      - name: Install deps (with retry)
        run: |
          set -euxo pipefail
          MGR="${{ steps.pm.outputs.mgr }}"
          if [ "$MGR" = "pnpm" ]; then
            corepack enable
            pnpm -v || npm i -g pnpm
            pnpm install --frozen-lockfile || (sleep 3 && pnpm install --frozen-lockfile)
          elif [ "$MGR" = "yarn" ]; then
            corepack enable
            yarn -v || npm i -g yarn
            yarn install --frozen-lockfile || (sleep 3 && yarn install --frozen-lockfile)
          else
            npm ci --prefer-online || (sleep 3 && npm ci --prefer-online)
          fi

      - name: Show npm debug log on failure
        if: failure()
        run: |
          set +e
          find . -maxdepth 3 -name "npm-*.log" -print -exec sed -n '1,200p' {} \;

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: install
    outputs:
      exit_code: ${{ steps.tsc.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Show Node & registry
        run: |
          node -v
          npm -v
          npm config get registry
          ls -la

      - name: Configure npm auth (optional)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
            echo "npm auth OK"
          else
            echo "No NPM_TOKEN (OK si deps publiques)"
          fi

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "mgr=pnpm" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -f yarn.lock ]; then echo "mgr=yarn" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -f package-lock.json ]; then echo "mgr=npm" >> $GITHUB_OUTPUT; exit 0; fi
          echo "::error::No lockfile (pnpm-lock.yaml | yarn.lock | package-lock.json)."; exit 1

      - name: Install deps (with retry)
        run: |
          set -euxo pipefail
          MGR="${{ steps.pm.outputs.mgr }}"
          if [ "$MGR" = "pnpm" ]; then
            corepack enable
            pnpm -v || npm i -g pnpm
            pnpm install --frozen-lockfile || (sleep 3 && pnpm install --frozen-lockfile)
          elif [ "$MGR" = "yarn" ]; then
            corepack enable
            yarn -v || npm i -g yarn
            yarn install --frozen-lockfile || (sleep 3 && yarn install --frozen-lockfile)
          else
            npm ci --prefer-online || (sleep 3 && npm ci --prefer-online)
          fi

      - name: Show npm debug log on failure
        if: failure()
        run: |
          set +e
          find . -maxdepth 3 -name "npm-*.log" -print -exec sed -n '1,200p' {} \;

      - name: Type check
        id: tsc
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit ${PIPESTATUS[0]}

      - name: Parse typecheck results
        if: always()
        id: parse-results
        run: |
          if [ -f typecheck.txt ]; then
            count_errors=$(grep -c 'error TS' typecheck.txt || true)
            count_warnings=$(grep -c 'warning TS' typecheck.txt || true)
            echo "errors=${count_errors:-0}" >> "$GITHUB_OUTPUT"
            echo "warnings=${count_warnings:-0}" >> "$GITHUB_OUTPUT"
            head -n 20 typecheck.txt > typecheck-summary.txt || true
          fi

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: |
            typecheck.txt
            typecheck-summary.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment PR with typecheck results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const errors = '${{ steps.parse-results.outputs.errors }}';
            const warnings = '${{ steps.parse-results.outputs.warnings }}';
            const exitCode = '${{ steps.tsc.outputs.exit_code }}';
            let body = '## 🔍 TypeScript Check Results\n\n';
            if (exitCode === '0') {
              body += '✅ **No TypeScript errors found!**\n';
            } else {
              body += `❌ **Found ${errors} error(s) and ${warnings} warning(s)**\n\n`;
              if (fs.existsSync('typecheck-summary.txt')) {
                const content = fs.readFileSync('typecheck-summary.txt', 'utf8');
                body += '<details><summary>First 20 lines</summary>\n\n```\n' + content + '\n```\n</details>\n';
              }
              body += '📥 Full logs in the Actions run.\n';
            }
            github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Fail if typecheck failed
        if: steps.tsc.outputs.exit_code != '0'
        run: |
          echo "::error::TypeScript typecheck failed with ${{ steps.parse-results.outputs.errors }} errors"
          exit 1

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: install
    outputs:
      exit_code: ${{ steps.lint.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Show Node & registry
        run: |
          node -v
          npm -v
          npm config get registry
          ls -la

      - name: Configure npm auth (optional)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
            echo "npm auth OK"
          else
            echo "No NPM_TOKEN (OK si deps publiques)"
          fi

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "mgr=pnpm" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -f yarn.lock ]; then echo "mgr=yarn" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -f package-lock.json ]; then echo "mgr=npm" >> $GITHUB_OUTPUT; exit 0; fi
          echo "::error::No lockfile (pnpm-lock.yaml | yarn.lock | package-lock.json)."; exit 1

      - name: Install deps (with retry)
        run: |
          set -euxo pipefail
          MGR="${{ steps.pm.outputs.mgr }}"
          if [ "$MGR" = "pnpm" ]; then
            corepack enable
            pnpm -v || npm i -g pnpm
            pnpm install --frozen-lockfile || (sleep 3 && pnpm install --frozen-lockfile)
          elif [ "$MGR" = "yarn" ]; then
            corepack enable
            yarn -v || npm i -g yarn
            yarn install --frozen-lockfile || (sleep 3 && yarn install --frozen-lockfile)
          else
            npm ci --prefer-online || (sleep 3 && npm ci --prefer-online)
          fi

      - name: Show npm debug log on failure
        if: failure()
        run: |
          set +e
          find . -maxdepth 3 -name "npm-*.log" -print -exec sed -n '1,200p' {} \;

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit ${PIPESTATUS[0]}

      - name: Parse lint results
        if: always()
        id: parse-lint
        run: |
          if [ -f lint.txt ]; then
            count_errors=$(grep -c 'error' lint.txt || true)
            count_warnings=$(grep -c 'warning' lint.txt || true)
            echo "errors=${count_errors:-0}" >> "$GITHUB_OUTPUT"
            echo "warnings=${count_warnings:-0}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment PR with lint results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const errors = '${{ steps.parse-lint.outputs.errors }}';
            const warnings = '${{ steps.parse-lint.outputs.warnings }}';
            const exitCode = '${{ steps.lint.outputs.exit_code }}';
            let body = '## 🧹 ESLint Results\n\n';
            if (exitCode === '0') {
              body += '✅ **No linting errors found!**\n';
            } else {
              body += `⚠️ **Found ${errors} error(s) and ${warnings} warning(s)**\n\n`;
              body += '📥 Full logs in the Actions run.\n';
            }
            github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Warn if lint failed
        if: steps.lint.outputs.exit_code != '0'
        run: echo "::warning::ESLint found issues but continuing build"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Show Node & registry
        run: |
          node -v
          npm -v
          npm config get registry
          ls -la

      - name: Configure npm auth (optional)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
            echo "npm auth OK"
          else
            echo "No NPM_TOKEN (OK si deps publiques)"
          fi

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "mgr=pnpm" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -f yarn.lock ]; then echo "mgr=yarn" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -f package-lock.json ]; then echo "mgr=npm" >> $GITHUB_OUTPUT; exit 0; fi
          echo "::error::No lockfile (pnpm-lock.yaml | yarn.lock | package-lock.json)."; exit 1

      - name: Install deps (with retry)
        run: |
          set -euxo pipefail
          MGR="${{ steps.pm.outputs.mgr }}"
          if [ "$MGR" = "pnpm" ]; then
            corepack enable
            pnpm -v || npm i -g pnpm
            pnpm install --frozen-lockfile || (sleep 3 && pnpm install --frozen-lockfile)
          elif [ "$MGR" = "yarn" ]; then
            corepack enable
            yarn -v || npm i -g yarn
            yarn install --frozen-lockfile || (sleep 3 && yarn install --frozen-lockfile)
          else
            npm ci --prefer-online || (sleep 3 && npm ci --prefer-online)
          fi

      - name: Show npm debug log on failure
        if: failure()
        run: |
          set +e
          find . -maxdepth 3 -name "npm-*.log" -print -exec sed -n '1,200p' {} \;

      - name: Build
        id: build
        run: |
          npm run build
          echo "Build completed successfully"

      - name: Check build output
        run: |
          if [ -d "dist" ]; then
            echo "✅ dist directory created"
            du -sh dist || true
          else
            echo "❌ dist directory not found"
            exit 1
          fi

      - name: Comment PR with build results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.build.outcome }}' === 'success';
            const body = ok
              ? '## 🏗️ Build Results\n\n✅ **Build completed successfully!**\n\n🚀 Ready to deploy'
              : '## 🏗️ Build Results\n\n❌ **Build failed**\n\nPlease check the logs for details.';
            github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  quality-check-summary:
    name: Quality summary
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build]
    if: always()
    steps:
      - name: Summarize results
        run: |
          echo "Typecheck: ${{ needs.typecheck.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Build: ${{ needs.build.result }}"
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "::error::Typecheck failed"; exit 1; fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Build failed"; exit 1; fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::warning::Lint had issues but not blocking"; fi
          echo "✅ Quality checks completed"

   
