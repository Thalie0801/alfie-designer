name: Node Quality Checks

on:
  workflow_dispatch: {}
  push:
    branches: [main, refonte-alfie-2025]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.json'
      - '**/*.css'
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - bun.lockb
      - tsconfig*.json
      - next.config.*
      - vite.config.*
      - tailwind.config.*
      - postcss.config.*
      - eslint.config.*
      - .github/workflows/node-quality.yml
  pull_request:
    branches: [main, refonte-alfie-2025]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.json'
      - '**/*.css'
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - bun.lockb
      - tsconfig*.json
      - next.config.*
      - vite.config.*
      - tailwind.config.*
      - postcss.config.*
      - eslint.config.*
      - .github/workflows/node-quality.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: node-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.tsc.outputs.exit_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-online --no-audit --no-fund
          fi

      - name: Type check
        id: tsc
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck.txt
          if-no-files-found: warn

      - name: Fail if typecheck failed
        if: steps.tsc.outputs.exit_code != '0'
        run: exit 1

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: typecheck
    if: always()
    outputs:
      exit_code: ${{ steps.lint.outputs.exit_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-online --no-audit --no-fund
          fi

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint.txt
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    if: always()
    outputs:
      result: ${{ job.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-online --no-audit --no-fund
          fi

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: Build application
        run: npm run build

  summary:
    name: Quality summary
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build]
    if: always()
    steps:
      - name: Summarize results
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const checks = [
              {
                label: 'Type check',
                result: '${{ needs.typecheck.result }}',
                exitCode: '${{ needs.typecheck.outputs.exit_code }}'
              },
              {
                label: 'ESLint',
                result: '${{ needs.lint.result }}',
                exitCode: '${{ needs.lint.outputs.exit_code }}'
              },
              {
                label: 'Build',
                result: '${{ needs.build.result }}',
                exitCode: ''
              }
            ];

            const statusEmoji = (result) => {
              switch (result) {
                case 'success':
                  return '✅';
                case 'skipped':
                  return '⏭️';
                case 'cancelled':
                  return '⚠️';
                default:
                  return '❌';
              }
            };

            let table = '| Check | Status | Details |\n| --- | --- | --- |\n';
            for (const check of checks) {
              const exitCode = check.exitCode && check.exitCode.length > 0 ? check.exitCode : '0';
              const detail = check.exitCode !== '' ? `exit code ${exitCode}` : '—';
              table += `| ${check.label} | ${statusEmoji(check.result)} ${check.result} | ${detail} |\n`;
            }

            core.summary
              .addHeading('Node quality checks')
              .addRaw(table)
              .write();

            if (context.eventName === 'pull_request') {
              const body = `## Node quality checks\n\n${table}\n\n- 📄 TypeScript log: [artifact](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n- 📄 ESLint log: [artifact](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }
